<script>
(function () {
  var temi = ['dark', 'black', 'light'];
  var nomi = { dark: 'Scuro', black: 'Nero', light: 'Chiaro' };
  var tema = 'dark';
  try { tema = localStorage.getItem('tema') || 'dark'; } catch (e) {}
  if (temi.indexOf(tema) === -1) tema = 'dark';
  document.documentElement.setAttribute('data-theme', tema);
  document.addEventListener('DOMContentLoaded', function () {
    var b = document.createElement('button');
    b.id = 'cambia-tema';
    b.type = 'button';
    function aggiorna() { b.textContent = 'Tema: ' + nomi[tema]; b.title = 'Cambia tema (scuro, nero, chiaro)'; }
    b.addEventListener('click', function () {
      tema = temi[(temi.indexOf(tema) + 1) % temi.length];
      document.documentElement.setAttribute('data-theme', tema);
      try { localStorage.setItem('tema', tema); } catch (e) {}
      aggiorna();
    });
    aggiorna();
    document.body.appendChild(b);
  });
})();
</script>
