<script>
(function () {
  var radice = document.documentElement;
  var tema = 'dark', scala = 1;
  try {
    tema = localStorage.getItem('tema') || 'dark';
    scala = parseFloat(localStorage.getItem('scala')) || 1;
  } catch (e) {}
  if (tema !== 'light') tema = 'dark';
  if (scala < 0.8 || scala > 1.6) scala = 1;
  radice.setAttribute('data-theme', tema);
  radice.style.setProperty('--scala', scala);
  document.addEventListener('DOMContentLoaded', function () {
    var box = document.createElement('div');
    box.id = 'strumenti-sito';
    function bottone(testo, titolo, azione) {
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = testo; b.title = titolo;
      b.addEventListener('click', azione);
      box.appendChild(b);
      return b;
    }
    function salva(chiave, valore) { try { localStorage.setItem(chiave, valore); } catch (e) {} }
    function cambiaScala(delta) {
      scala = Math.round(Math.min(1.6, Math.max(0.8, scala + delta)) * 10) / 10;
      radice.style.setProperty('--scala', scala);
      salva('scala', scala);
    }
    bottone('A−', 'Riduci il testo', function () { cambiaScala(-0.1); });
    bottone('A+', 'Ingrandisci il testo', function () { cambiaScala(0.1); });
    var bt = bottone('', 'Cambia tema', function () {
      tema = tema === 'dark' ? 'light' : 'dark';
      radice.setAttribute('data-theme', tema);
      salva('tema', tema);
      bt.textContent = tema === 'dark' ? 'Chiaro' : 'Scuro';
    });
    bt.textContent = tema === 'dark' ? 'Chiaro' : 'Scuro';
    document.body.appendChild(box);
  });
})();
</script>
